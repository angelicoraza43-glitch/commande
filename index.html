<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{font-family:sans-serif;max-width:480px;margin:auto;padding:12px}
#langues{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}
.lg{padding:6px 10px;border:1px solid #ccc;border-radius:16px;background:#fff;font-size:14px;cursor:pointer}
.lg.actif{background:#2e9e4f;color:#fff;border-color:#2e9e4f}
.ligne{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ddd}
.ligne .txt{flex:1}
.ligne img,.ph{width:64px;height:64px;object-fit:cover;border-radius:8px;flex-shrink:0}
.ph{background:#eee;display:flex;align-items:center;justify-content:center;font-size:26px}
.ligne img{cursor:zoom-in}
.qte{white-space:nowrap}
.qte button{width:36px;height:36px;font-size:18px}
.qte span{display:inline-block;width:32px;text-align:center}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999}
#zoom img{max-width:94%;max-height:90%;border-radius:8px}
#carte{height:300px;margin:8px 0;border-radius:8px}
input,textarea{width:100%;padding:8px;box-sizing:border-box;margin:4px 0;font-size:16px}
#total{font-size:20px;font-weight:bold;margin:12px 0 4px}
#panier{white-space:pre-line;font-size:14px;color:#444;margin-bottom:8px}
.gros{width:100%;padding:12px;font-size:16px;margin-top:8px}
.ok{background:#e6f6ea;border:2px solid #2e9e4f;color:#17622f;padding:16px;border-radius:8px;margin:12px 0}
.err{background:#fdeaea;border:2px solid #d33;color:#9a1b1b;padding:12px;border-radius:8px;margin:12px 0}
.info{background:#eef4ff;border:1px solid #9bb8f0;padding:10px;border-radius:8px;margin:8px 0}
.nb{color:#c00;font-weight:bold;font-size:14px;margin:10px 0;padding:8px 10px;border-left:4px solid #c00;background:#fff5f5;border-radius:4px}
.ok .nb{font-size:15px}
.res{display:block;width:100%;text-align:left;padding:10px;margin:0;font-size:15px;background:#fff;border:0;border-bottom:1px solid #eee}
.res small{display:block;color:#666;margin-top:2px}
#resultats{border-radius:8px;overflow:hidden;background:#fff}
#resultats .titre{padding:8px 10px;font-size:13px;color:#666;background:#f5f5f5}
.pay{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #ccc;border-radius:8px;margin:6px 0;font-size:16px}
.pay input{width:auto;margin:0}
pre{white-space:pre-wrap;background:#fff;padding:8px;color:#222}
.cache{display:none}
</style>
</head>
<body>

<div id="zoom" onclick="this.style.display='none'"><img id="zoomImg" alt=""></div>

<div id="confirmation" class="cache">
  <div class="ok">
    <h2 data-i18n="conf_titre"></h2>
    <p id="msgConf"></p>
    <div id="msgPaiement" class="nb cache"></div>
    <pre id="recap"></pre>
  </div>
  <button class="gros" data-i18n="nouvelle" onclick="location.reload()"></button>
</div>

<div id="formulaire">

<div id="langues">
  <button class="lg" data-l="fr" onclick="setLang('fr')">🇫🇷 Français</button>
  <button class="lg" data-l="mg" onclick="setLang('mg')">🇲🇬 Malagasy</button>
  <button class="lg" data-l="en" onclick="setLang('en')">🇬🇧 English</button>

<div id="panier"></div>

<button class="gros" data-i18n="btn_pos" onclick="maPosition()"></button>

const LOCALES = {fr:"fr-FR", mg:"fr-FR", en:"en-US"};
const NOMS_LANGUES = {fr:"Français", mg:"Malagasy", en:"English"};

let LANG = "fr";
try{ const s=localStorage.getItem("langue"); if(s && T[s]) LANG=s; }catch(e){}

function t(cle,vars){
  let s=(T[LANG] && T[LANG][cle]) || T.fr[cle] || cle;
  if(vars){ for(const k in vars) s=s.replace("{"+k+"}",vars[k]); }
  return s;
}
function fmt(n){ return n.toLocaleString(LOCALES[LANG]); }
function nomAff(p){ return p[LANG] || p.nom; }
function unite(p){ return p.unite || "kg"; }
function uniteAff(p){ const u=unite(p); return (UNITES[u] && UNITES[u][LANG]) || u; }
function norm(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
function zoom(src){
  document.getElementById("zoomImg").src=src;
  document.getElementById("zoom").style.display="flex";
}

// ===== PRODUITS =====
const qte = {};
PRODUITS.forEach((p,i)=>{ qte[i]=0; });
const liste = document.getElementById("liste");

function renderListe(){
  let h="";
  PRODUITS.forEach((p,i)=>{
    const f = p.photo ? encodeURI(p.photo) : "";
    const photo = p.photo
      ? `<img src="${f}" alt="${nomAff(p)}" loading="lazy" onclick="zoom('${f}')" onerror="this.outerHTML='<div class=ph>📦</div>'">`
      : `<div class="ph">📦</div>`;
    h += `<div class="ligne" id="l${i}">${photo}
    <div class="txt">${nomAff(p)}<br><small>${fmt(p.prix)} Ar/${uniteAff(p)}</small></div>
    <div class="qte"><button onclick="chg(${i},-1)">−</button><span id="q${i}">${qte[i]}</span><button onclick="chg(${i},1)">+</button></div></div>`;
  });
  liste.innerHTML=h;
  filtrer();
}
function chg(i,d){
  qte[i]=Math.max(0,qte[i]+d);
  document.getElementById("q"+i).textContent=qte[i];
  calcul();
  majPaiement();
}
function calcul(){
  let tot=0, lignes=[];
  PRODUITS.forEach((p,i)=>{
    tot+=p.prix*qte[i];
    if(qte[i]>0) lignes.push("• "+nomAff(p)+" : "+qte[i]+" "+uniteAff(p));
  });
  document.getElementById("total").textContent=t("total")+" "+fmt(tot)+" Ar";
  document.getElementById("panier").textContent = lignes.length ? t("panier")+"\n"+lignes.join("\n") : "";
  return tot;
}
function filtrer(){
  const q=norm(document.getElementById("rechProduit").value.trim());
  let visibles=0;
  PRODUITS.forEach((p,i)=>{
    const ok=[p.nom,p.mg,p.en].filter(Boolean).some(n=>norm(n).includes(q));
    const el=document.getElementById("l"+i);
    if(el) el.style.display = ok ? "" : "none";
    if(ok) visibles++;
  });
  document.getElementById("aucun").classList.toggle("cache", visibles>0);
}
document.getElementById("rechProduit").addEventListener("input",filtrer);

// ===== CARTE (plan ou satellite) =====
let positionChoisie=false;
const carte = L.map("carte").setView([-20.5318,47.2428],13); // position de départ : à changer pour votre ville

const plan = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"});
const satellite = L.layerGroup([
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Imagery © Esri"}),
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:19})
]);
plan.addTo(carte);
let ctrlCouches=null;
function majCouches(){
  if(ctrlCouches) ctrlCouches.remove();
  const couches={};
  couches[t("couche_plan")]=plan;
  couches[t("couche_sat")]=satellite;
  ctrlCouches=L.control.layers(couches,null,{position:"topright",collapsed:true}).addTo(carte);
}

const repere = L.marker(carte.getCenter(),{draggable:true}).addTo(carte);

// Statut de la position (traduit à chaque changement de langue)
let statutEtat={cle:"stat_init",vars:{},coords:false};
function setStatut(cle,vars,coords){
  statutEtat={cle:cle,vars:vars||{},coords:!!coords};
  renderStatut();
}
function renderStatut(){
  const el=document.getElementById("statut");
  el.textContent=t(statutEtat.cle,statutEtat.vars);
  if(statutEtat.coords){
    const ll=repere.getLatLng();
    el.appendChild(document.createElement("br"));
    const s=document.createElement("small");
    s.textContent=t("coords")+" "+ll.lat.toFixed(6)+", "+ll.lng.toFixed(6);
    el.appendChild(s);
  }
}
function definirPosition(lat,lng,zoomNiveau,cle,vars){
  repere.setLatLng([lat,lng]);
  carte.setView([lat,lng],zoomNiveau);
  positionChoisie=true;
  setStatut(cle,vars,true);
}
carte.on("click",e=>{
  repere.setLatLng(e.latlng);
  positionChoisie=true;
  setStatut("pos_main",{},true);
});
repere.on("dragend",()=>{
  positionChoisie=true;
  setStatut("pos_main",{},true);
});

// Position automatique du client
function maPosition(){
  if(!navigator.geolocation){
    setStatut("pos_none");
    return;
  }
  setStatut("stat_init");
  navigator.geolocation.getCurrentPosition(pos=>{
    definirPosition(pos.coords.latitude,pos.coords.longitude,17,"pos_ok",{p:Math.round(pos.coords.accuracy)});
  },()=>{
    setStatut("pos_fail");
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

// ===== RECHERCHE DE LIEU AVEC SUGGESTIONS (Photon / OpenStreetMap) =====
const champ=document.getElementById("recherche");
const zone=document.getElementById("resultats");
let minuteur=null, dernier=0;

function lireRecents(){
  try{ return JSON.parse(localStorage.getItem("recents")||"[]"); }catch(e){ return []; }
}
function ajouterRecent(lieu){
  try{
    let r=lireRecents().filter(x=>!(x.lat===lieu.lat && x.lon===lieu.lon));
    r.unshift(lieu);
    localStorage.setItem("recents",JSON.stringify(r.slice(0,5)));
  }catch(e){}
}
function bouton(icone,lieu){
  const b=document.createElement("button");
  b.className="res";
  const tt=document.createElement("b");
  tt.textContent=icone+" "+lieu.titre;
  b.appendChild(tt);
  if(lieu.suite){
    const s=document.createElement("small");
    s.textContent=lieu.suite;
    b.appendChild(s);
  }
  b.onclick=()=>choisir(lieu);
  return b;
}
function choisir(lieu){
  const court = lieu.suite ? lieu.titre+", "+lieu.suite.split(",")[0] : lieu.titre;
  definirPosition(lieu.lat,lieu.lon,17,"lieu_choisi",{n:court});
  ajouterRecent(lieu);
  champ.value=lieu.titre;
  zone.innerHTML="";
  champ.blur();
}
function afficherRecents(){
  zone.innerHTML="";
  const r=lireRecents();
  if(!r.length) return;
  const h=document.createElement("div");
  h.className="titre";
  h.textContent=t("recent");
  zone.appendChild(h);
  r.forEach(l=>zone.appendChild(bouton("🕘",l)));
}
async function chercher(q){
  const id=++dernier;
  const ll=repere.getLatLng();
  try{
    const url="https://photon.komoot.io/api/?limit=6&lang=fr&bbox=43.2,-25.7,50.6,-11.9&lat="+ll.lat+"&lon="+ll.lng+"&q="+encodeURIComponent(q);
    const r=await fetch(url);
    const data=await r.json();
    if(id!==dernier) return;
    zone.innerHTML="";
    const lieux=(data.features||[]).map(f=>{
      const p=f.properties||{};
      const titre=p.name||p.street||p.city||p.district||"Lieu";
      const suite=[...new Set([p.street,p.district,p.city||p.county,p.state].filter(x=>x && x!==titre))].join(", ");
      return {titre,suite,lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]};
    });
    if(!lieux.length){
      zone.textContent=t("aucun_lieu");
      return;
    }
    lieux.forEach(l=>zone.appendChild(bouton("📍",l)));
  }catch(e){
    if(id!==dernier) return;
    zone.textContent=t("rech_impossible");
  }
}
champ.addEventListener("input",()=>{
  clearTimeout(minuteur);
  const q=champ.value.trim();
  if(q.length<3){ dernier++; afficherRecents(); return; }
  minuteur=setTimeout(()=>chercher(q),400);
});
champ.addEventListener("focus",()=>{ if(champ.value.trim().length<3) afficherRecents(); });
champ.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    clearTimeout(minuteur);
    const q=champ.value.trim();
    if(q.length>=2) chercher(q);
  }
});

// ===== PAIEMENT =====
const PAIEMENT_NUMEROS = {
  "Mvola": {numero:"0382698090", affiche:"038 26 980 90", compte:"Angelico"},
  "Orange Money": {numero:"0377057929", affiche:"037 70 579 29", compte:"Angelico Razafinantenaina"}
};
function copierNumero(n){
  if(navigator.clipboard){
    navigator.clipboard.writeText(n).then(()=>alert(t("copie")+" "+n)).catch(()=>alert(t("num_alert")+" "+n));
  }else{ alert(t("num_alert")+" "+n); }
}
function majPaiement(){
  const choix=document.querySelector('input[name="paiement"]:checked').value;
  const zonePay=document.getElementById("infoPay");
  const p=PAIEMENT_NUMEROS[choix];
  if(!p){ zonePay.classList.add("cache"); return; }
  const tot=calcul();
  zonePay.innerHTML = tot===0
    ? t("choisir_d")
    : `${t("montant")} <b>${fmt(tot)} Ar</b><br>
${t("moyen")} <b>${choix}</b><br>
${t("numero")} <b style="font-size:20px">${p.affiche}</b><br>
${t("compte")} <b>${p.compte}</b><br>
<button class="gros" type="button" onclick="copierNumero('${p.numero}')">${t("copier")}</button>
<div class="nb">${t("nb")}</div>
<small>${t("nom_aide")}</small>`;
  zonePay.classList.remove("cache");
}
document.querySelectorAll('input[name="paiement"]').forEach(r=>r.addEventListener("change",majPaiement));

// ===== CHANGEMENT DE LANGUE =====
function appliquerStatique(){
  document.querySelectorAll("[data-i18n]").forEach(e=>{ e.textContent=t(e.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>{ e.placeholder=t(e.getAttribute("data-i18n-ph")); });
}
function setLang(l){
  if(!T[l]) l="fr";
  LANG=l;
  try{ localStorage.setItem("langue",l); }catch(e){}
  document.documentElement.lang=l;
  document.title=t("titre_page");
  appliquerStatique();
  document.querySelectorAll("#langues button").forEach(b=>b.classList.toggle("actif",b.getAttribute("data-l")===l));
  renderListe();
  calcul();
  majPaiement();
  renderStatut();
  majCouches();
  zone.innerHTML="";
}

// ===== ENVOI DE LA COMMANDE =====
function montrerErreur(msg){
  const e=document.getElementById("erreur");
  e.textContent=msg;
  e.classList.remove("cache");
  e.scrollIntoView({behavior:"smooth",block:"center"});
}

async function valider(){
  document.getElementById("erreur").classList.add("cache");
  const nom=document.getElementById("nom").value.trim();
  const tel=document.getElementById("tel").value.trim();
  const rep=document.getElementById("repere").value.trim();
  const tot=calcul();

  if(tot===0) return montrerErreur(t("err_prod"));
  if(!nom) return montrerErreur(t("err_nom"));
  if(!tel) return montrerErreur(t("err_tel"));
  if(!positionChoisie && !rep) return montrerErreur(t("err_lieu"));

  const paiement=document.querySelector('input[name="paiement"]:checked').value;

  // Texte reçu par e-mail : toujours en français
  let txtMail="";
  PRODUITS.forEach((p,i)=>{ if(qte[i]>0) txtMail+=`- ${p.nom} : ${qte[i]} ${unite(p)}\n`; });
  txtMail+=`\nTotal : ${tot.toLocaleString("fr-FR")} Ar`;
  txtMail+=`\nPaiement : ${paiement}`;
  txtMail+=`\nLangue du client : ${NOMS_LANGUES[LANG]}`;

  // Récapitulatif montré au client : dans sa langue
  let txtClient="";
  PRODUITS.forEach((p,i)=>{ if(qte[i]>0) txtClient+=`- ${nomAff(p)} : ${qte[i]} ${uniteAff(p)}\n`; });
  txtClient+=`\n${t("total")} ${fmt(tot)} Ar`;
  const payAff = paiement==="À la livraison" ? t("pay_livraison_court") : paiement;
  txtClient+=`\n${t("pay_ligne")} : ${payAff}`;

  const ll=repere.getLatLng();
  const coord=ll.lat.toFixed(6)+","+ll.lng.toFixed(6);
  const lieu = positionChoisie
    ? `Coordonnées : ${coord}\nVoir sur Google Maps : https://www.google.com/maps?q=${coord}\nItinéraire Google Maps : https://www.google.com/maps/dir/?api=1&destination=${coord}`
    : "Pas de position sur la carte (voir le point de repère)";
  const complet = `COMMANDE\n${txtMail}\n\nNom : ${nom}\nTél : ${tel}\nPoint de repère : ${rep}\n\n${lieu}`;

  const btn=document.getElementById("btn");
  btn.disabled=true;
  btn.textContent=t("envoi");

  try{
    const rep2 = await fetch("https://api.web3forms.com/submit",{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({
        access_key:CLE,
        subject:"Nouvelle commande de "+nom,
        from_name:"Commande légumes",
        name:nom,
        phone:tel,
        message:complet
      })
    });
    const data = await rep2.json();
    if(data.success){
      const msgConf=document.getElementById("msgConf");
      const msgPaiement=document.getElementById("msgPaiement");
      if(paiement==="À la livraison"){
        msgConf.textContent=t("conf_livraison");
        msgPaiement.classList.add("cache");
      }else{
        msgConf.textContent=t("conf_mobile");
        msgPaiement.textContent=t("conf_rouge");
        msgPaiement.classList.remove("cache");
      }
      document.getElementById("recap").textContent=txtClient;
      document.getElementById("formulaire").classList.add("cache");
      document.getElementById("confirmation").classList.remove("cache");
      window.scrollTo({top:0,behavior:"smooth"});
    }else{
      throw new Error("echec");
    }
  }catch(err){
    btn.disabled=false;
    btn.textContent=t("valider");
    montrerErreur(t("err_envoi"));
  }
}
